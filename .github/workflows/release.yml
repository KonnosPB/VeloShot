name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & Publish Linux Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (GTK4 & Libadwaita)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config libdbus-1-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests before packaging
        run: cargo test --all-targets

      - name: Build release binary
        run: cargo build --release

      - name: Package release archive & checksums
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_DIR="veloshot-${TAG}-x86_64-linux-ubuntu24.04"
          mkdir -p "dist/${PKG_DIR}"
          cp target/release/veloshot "dist/${PKG_DIR}/"
          cp install-local.sh LICENSE README.md "dist/${PKG_DIR}/"
          cp -r data "dist/${PKG_DIR}/"
          (
            cd dist
            tar -czf "${PKG_DIR}.tar.gz" "${PKG_DIR}"
            rm -rf "${PKG_DIR}"
            sha256sum "${PKG_DIR}.tar.gz" > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
