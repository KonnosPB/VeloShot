name: Feature Request
description: Suggest an improvement or new capability for VeloShot
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use Case / Problem
      description: What workflow or pain point would this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How should the feature look or behave?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, or desktop environment details (Wayland/GNOME/KDE/Sway).
    validations:
      required: false
