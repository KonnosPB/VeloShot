[package]
name = "veloshot"
version = "0.1.1"
edition = "2024"
authors = ["KonnosPB"]
license = "MIT"
description = "Fast, fluid screenshot tool written in Rust for Ubuntu Wayland with an interactive carousel history."
repository = "https://github.com/KonnosPB/VeloShot"
readme = "README.md"
keywords = ["screenshot", "wayland", "ubuntu", "rust", "carousel"]
categories = ["multimedia::images", "gui"]

[[bin]]
name = "veloshot"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_14"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
async-channel = "2"
ksni = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
