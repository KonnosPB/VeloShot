name: veloshot
base: core24
version: "0.1.0"
summary: Fast Ubuntu Wayland screenshot tool with live loupe, carousel & editor
description: |
  VeloShot is a fast, native screenshot tool for Ubuntu Wayland (GNOME) written
  in Rust with GTK4 and Libadwaita. It features a 6x live zoom loupe,
  an interactive 60+ FPS screenshot history carousel (Top, Bottom, Center with
  spring-animated Top/Bottom flip), a full-featured annotation editor
  (rectangles, arrows, highlighter, freehand, numbered steps, text, speech
  bubbles, pixelate, spotlight, crop, Beautify frames, optional offline OCR),
  and 17 European languages.

grade: stable
confinement: strict
icon: data/icons/hicolor/scalable/apps/io.github.konnospb.VeloShot.svg

apps:
  veloshot:
    command: bin/veloshot
    extensions: [gnome]
    common-id: io.github.konnospb.VeloShot
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - home

parts:
  veloshot:
    plugin: rust
    source: .
    rust-channel: "stable"
    build-packages:
      - pkg-config
      - libgtk-4-dev
      - libadwaita-1-dev
      - libdbus-1-dev
    override-build: |
      craftctl default
      install -Dm644 data/io.github.konnospb.VeloShot.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/io.github.konnospb.VeloShot.desktop"
      install -Dm644 data/io.github.konnospb.VeloShot.metainfo.xml \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/io.github.konnospb.VeloShot.metainfo.xml"
      install -Dm644 data/icons/hicolor/scalable/apps/io.github.konnospb.VeloShot.svg \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/io.github.konnospb.VeloShot.svg"
      install -Dm644 data/icons/hicolor/symbolic/apps/io.github.konnospb.VeloShot-symbolic.svg \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/symbolic/apps/io.github.konnospb.VeloShot-symbolic.svg"
