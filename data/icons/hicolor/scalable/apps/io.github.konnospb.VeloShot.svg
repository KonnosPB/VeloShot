<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#5b46d6"/>
    </linearGradient>
  </defs>

  <!-- Subtle ground shadow -->
  <rect x="4" y="8" width="120" height="118" rx="26" fill="#000000" fill-opacity="0.18"/>

  <!-- Full-bodied rounded square -->
  <rect x="4" y="4" width="120" height="118" rx="26" fill="url(#bg)"/>

  <!-- Bold viewfinder corner brackets -->
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 26 46 V 32 Q 26 26 32 26 H 46"/>
    <path d="M 82 26 H 96 Q 102 26 102 32 V 46"/>
    <path d="M 26 80 V 94 Q 26 100 32 100 H 46"/>
    <path d="M 82 100 H 96 Q 102 100 102 94 V 80"/>
  </g>

  <!-- Centered aperture ring + accent shutter dot -->
  <circle cx="64" cy="63" r="18" fill="none" stroke="#ffffff" stroke-width="8"/>
  <circle cx="64" cy="63" r="6.5" fill="#ff8a2b"/>
</svg>
